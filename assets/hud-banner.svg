<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="ops://bunny: Bunny, Karu Praneeth Kumar, agent builder, intern at Cyrene AI. Agents online: SOC Copilot, TARS, termfps. Press start to hire.">
  <style>
    .mono { font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace; }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.1s; }
    .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 1.9s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .title { font-size: 86px; font-weight: 700; letter-spacing: 10px; }
    .gr { fill: #ff2e63; opacity: .7; animation: gr 3s 2s infinite steps(1); }
    .gc { fill: #08d9d6; opacity: .7; animation: gc 3s 2s infinite steps(1); }
    @keyframes gr { 0%,100% { transform: none; } 6% { transform: translate(-4px,1px); } 8% { transform: translate(3px,-1px); } 10% { transform: none; } 70% { transform: translate(-2px,0); } 72% { transform: none; } }
    @keyframes gc { 0%,100% { transform: none; } 6% { transform: translate(4px,-1px); } 8% { transform: translate(-3px,1px); } 10% { transform: none; } 70% { transform: translate(2px,0); } 72% { transform: none; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .zombie { transform-origin: 796px 150px; animation: walk 5s ease-in-out infinite alternate; }
    @keyframes walk { from { transform: translate(-26px,0) scale(.85); } to { transform: translate(26px,4px) scale(1.2); } }
    .hp { transform-origin: 0 0; transform: scaleX(0); animation: hp 1.6s 2.4s ease-out forwards; }
    @keyframes hp { to { transform: scaleX(1); } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".22"/></pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".7"/></radialGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#39d353" stop-opacity=".10"/><stop offset=".6" stop-color="#39d353" stop-opacity="0"/></linearGradient>
    <clipPath id="screen"><rect x="10" y="10" width="980" height="280" rx="18"/></clipPath>
    <clipPath id="view"><rect x="640" y="44" width="312" height="212" rx="8"/></clipPath>
  </defs>

  <rect width="1000" height="300" rx="22" fill="#05080a"/>
