      <g transform="translate(143,0)"><rect x="0" y="0" width="69" height="26" rx="13" fill="#0f1f16" stroke="#f97316" stroke-opacity=".6"/><circle cx="14" cy="13" r="4" fill="#f97316" class="pulse"/><text x="26" y="17.5" class="mono" font-size="13" fill="#cfe9d6">TARS</text></g>
      <g transform="translate(222,0)"><rect x="0" y="0" width="96" height="26" rx="13" fill="#0f1f16" stroke="#39d353" stroke-opacity=".6"/><circle cx="14" cy="13" r="4" fill="#39d353" class="pulse"/><text x="26" y="17.5" class="mono" font-size="13" fill="#cfe9d6">TERMFPS</text></g>
